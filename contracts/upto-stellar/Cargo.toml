[package]
name = "x402-upto-stellar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "x402 upto scheme settlement contract for Stellar"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
