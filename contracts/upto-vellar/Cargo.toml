[package]
name = "x402-upto-vellar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vellar's upto scheme settlement contract for Stellar, written from contracts/upto-vellar/DESIGN.md"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
