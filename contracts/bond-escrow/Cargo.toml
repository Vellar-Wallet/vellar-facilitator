[package]
name = "x402-bond-escrow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Provider bond escrow contract for the Vellar Bazaar (register_settlement + deposit + withdraw + file_dispute + post_receipt + finalize slice)"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
# Used only by tests to generate Ed25519 keypairs and sign raw receipt bytes directly (the
# delivery-key signing this contract's `post_receipt` verifies against), independent of Soroban's
# own auth-signing machinery (`soroban_sdk::testutils::sign`, which signs XDR-encoded `ScVal`
# auth payloads, not arbitrary raw bytes — the wrong shape for this contract's receipt scheme).
# Already present transitively via `soroban-sdk`'s own `testutils` feature (see Cargo.lock); named
# explicitly here so the version actually exercised is a first-class, visible fact rather than an
# implicit transitive pin.
ed25519-dalek = "2"
rand = "0.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
