# Render Blueprint — Vellar x402 Facilitator (testnet).
#
# One web service. The sponsor key funds settlement fees; keep it a dedicated
# testnet account, never a mainnet key. Set it in the Render dashboard
# (sync:false keeps it out of git).
#
# Free-tier caveat: Render spins the service down after 15 min without inbound
# traffic, and spin-down DESTROYS the container — measured at a 35.7s cold start
# on 2026-08-11, which is a replacement rather than a resume.
#
# That USED to empty the catalog and reset every ownership binding. With the
# catalog in libSQL/Turso it no longer does: the container is disposable and the
# data is not. Spin-down now costs only the cold start.
#
# The corollary is the cost of durability, and it is not a footnote: a squatted
# URL used to clear itself on the next spin-down. It no longer does. Recovery is
# docs/operator-runbook.md §1, by hand, until the displacement variant ships.

services:
  - type: web
    name: vellar-facilitator
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev && npm install -g tsx"
    startCommand: "tsx src/server.ts"
    healthCheckPath: /health
    # ── ATTACHING A PERSISTENT DISK — NOT THE CHOSEN PLAN ────────────────────
    # Kept for reference only. A disk was REJECTED in favour of an external store
    # (docs/milestone-durable-catalog.md): a disk costs money AND activates three
    # findings that are dormant on an ephemeral filesystem (G-5, G-6, G-7), which
    # a real store closes instead. Read that document before enabling any of this.
    #
    # If you do enable it: uncomment BOTH the `plan: starter` above (replacing `plan: free`) and the
    # `disk:` block below, together. They are one change: Render only offers
    # disks on paid instance types, so a disk block under `plan: free` fails to
    # deploy.
    #
    # THIS STARTS BILLING on the next deploy. It is left commented so that
    # merging this file is never itself the thing that starts charging.
    #
    # It fixes TWO independent causes of the empty catalog:
    #   1. no disk  — nothing survives any restart (the disk fixes this);
    #   2. idle-sleep — the free tier stops after ~15 min idle, so restarts
    #      happen constantly (moving off `free` fixes this).
    # A disk alone would not stop the sleeping, and not sleeping alone would not
    # survive a deploy. You need both, which is why they are one change here.
    #
    # The CATALOG_OWNERSHIP_BOOTSTRAP migration this block used to reference no
    # longer exists — see docs/brief-turso-migration.md. It was needed only
    # because an ownership FILE could be absent while a catalog FILE was present,
    # and one database cannot be half-present.
    #
    # disk:
    #   name: vellar-facilitator-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STELLAR_NETWORK
        value: "testnet"
      - key: STELLAR_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      # Raised fee ceiling: policy-governed smart-account payments cost ~130k
      # stroops; the @x402/stellar default (50k) rejects them. 500k is ~3.9x the
      # worst REAL settlement measured from this sponsor's own history (127,808)
      # and bounds worst-case drain per settle at 0.05 XLM. Raise if a heavier
      # policy legitimately needs it — rejection is loud, not silent.
      - key: MAX_TX_FEE_STROOPS
        value: "500000"
      # Bazaar catalog persistence — libSQL/Turso, NOT a file and NOT a disk.
      #
      # CATALOG_FILE is GONE. It is not merely unused: setting it now produces a
      # loud "NO LONGER USED" warning at boot, and leaving a stale reference here
      # would be exactly the confusion that warning exists to prevent.
      #
      # Two variables, both set in the DASHBOARD and never in this file:
      #
      #   CATALOG_DB_URL         libsql://<database>-<org>.turso.io
      #   CATALOG_DB_AUTH_TOKEN  a DATABASE-SCOPED read-write token
      #
      # ── TOKEN SCOPE IS A SECURITY DECISION, NOT A CONVENIENCE ────────────────
      # Mint it with:
      #
      #   turso db tokens create <database> --expiration never
      #
      # That is scoped to ONE database. Do NOT use a group token
      # (`turso group tokens create`) or a platform API token
      # (`turso auth api-tokens mint`): both reach beyond this database, and the
      # store needs nothing outside it.
      #
      # --read-only will NOT work: the store issues CREATE TABLE IF NOT EXISTS on
      # every boot and writes bindings on the settle path.
      #
      # `--expiration never` is deliberate. The catalog FAILS CLOSED on an
      # unusable store, so an expiring token is a scheduled outage: on expiry
      # discovery goes empty and /health reports catalogFrozen. Rotate
      # deliberately (mint the new token, set it, restart, revoke the old one) —
      # never on a timer nobody is watching.
      #
      # WHAT THE TOKEN PERMITS, stated plainly: full read-write over this ONE
      # database, which means whoever holds it can forge or clear any ownership
      # binding in it. That is F6 relocated rather than eliminated — see
      # docs/security-audit.md. It cannot touch any other database in the
      # account. Treat it like SPONSOR_SECRET_KEY.
      #
      # Unset CATALOG_DB_URL is legal and means IN-MEMORY: the service runs and
      # warns at boot, and every restart empties the catalog.
      #
      # BEFORE onboarding any merchant, read docs/operator-runbook.md §1. A bound
      # resource URL cannot rotate its payTo in band, and now that bindings are
      # DURABLE a squatted URL no longer clears itself on the next restart — the
      # manual procedure is the only recovery until the displacement variant
      # ships. That is deliberate; the runbook explains why automating it would
      # give away the property F11 exists for.
      # Deliberately NOT set: VERIFICATION_API_URL. Unset, every trust verdict
      # degrades to "unknown", which is the honest default. Configuring it makes
      # that API a trust root, and its response still carries no per-record
      # timestamp (so "newest" falls back to array order) and is unauthenticated.
      # See docs/security-audit.md (F4) for the precondition before enabling.
      - key: SPONSOR_SECRET_KEY
        sync: false

  # ── DEMO SELLER — for the end-to-end ownership-verification walkthrough ────
  #
  # WHY THIS EXISTS. Layer 2 ownership verification (F11) fetches the resource's
  # OWN 402 challenge over the network. It has never once succeeded against a
  # real public endpoint: every match-asserting test either relaxes the SSRF
  # guard (__insecureTestTransport) or stubs fetch and DNS, and the recorded
  # runs used RESOURCE_URL=http://localhost:4031/quote, which the guard rejects
  # for being non-https before a socket is opened. So the control is unproven on
  # the path it was built for. This service gives the seller a real public
  # hostname with a valid certificate so that path can finally be exercised.
  #
  # NOT an always-on service. It sleeps like any free instance; wake it, run the
  # walkthrough, let it sleep. Free instance hours are pooled per WORKSPACE
  # (750/month), so a few hours here is negligible — but note it does mean the
  # facilitator's keep-alive should stay at 20 h/day rather than 24/7:
  #   20 h/day (620 h) + a few hours of seller  -> ~127 h of margin
  #   24/7     (744 h) + a few hours of seller  -> over budget
  #
  # No healthCheckPath: the only route is /quote, which correctly returns 402
  # when unpaid. Render falls back to port-binding detection, which is what we
  # want — a 402 is the seller working, not failing.
  - type: web
    name: vellar-seller-demo
    runtime: node
    plan: free
    rootDir: examples
    buildCommand: "npm install"
    startCommand: "node seller.mjs"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Point the seller's resource server at the hosted facilitator, so the
      # walkthrough exercises the deployed build rather than a local one.
      - key: FACILITATOR_URL
        value: "https://vellar-facilitator.onrender.com"
      # The address this merchant advertises in its own 402 challenge, and
      # therefore the key the facilitator catalogs and re-fetches for F11
      # Layer 2. Without it seller.mjs falls back to http://localhost:<port>,
      # which is what made Layer 2 unreachable in production: the guard rejects
      # a non-https URL before opening a socket, so every cataloged entry was
      # permanently unverified.
      - key: PUBLIC_BASE_URL
        value: "https://vellar-seller-demo.onrender.com"
