# Render Blueprint — Vellar x402 Facilitator (testnet).
#
# One web service. The sponsor key funds settlement fees; keep it a dedicated
# testnet account, never a mainnet key. Set it in the Render dashboard
# (sync:false keeps it out of git).
#
# Free-tier caveat: Render spins the service down after 15 min without inbound
# traffic. Spin-down DESTROYS the container, so this is not merely a ~1 min cold
# start — it wipes CATALOG_FILE and its ownership store, emptying the Bazaar
# catalog and resetting every URL ownership binding. The keep-alive workflow
# (.github/workflows/keepalive.yml) is what prevents that between deploys.
# Fine for a testnet demo; upgrade the plan before any uptime commitment.

services:
  - type: web
    name: vellar-facilitator
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev && npm install -g tsx"
    startCommand: "tsx src/server.ts"
    healthCheckPath: /health
    # ── ATTACHING A PERSISTENT DISK — NOT THE CHOSEN PLAN ────────────────────
    # Kept for reference only. A disk was REJECTED in favour of an external store
    # (docs/milestone-durable-catalog.md): a disk costs money AND activates three
    # findings that are dormant on an ephemeral filesystem (G-5, G-6, G-7), which
    # a real store closes instead. Read that document before enabling any of this.
    #
    # If you do enable it: uncomment BOTH the `plan: starter` above (replacing `plan: free`) and the
    # `disk:` block below, together. They are one change: Render only offers
    # disks on paid instance types, so a disk block under `plan: free` fails to
    # deploy.
    #
    # THIS STARTS BILLING on the next deploy. It is left commented so that
    # merging this file is never itself the thing that starts charging.
    #
    # It fixes TWO independent causes of the empty catalog:
    #   1. no disk  — nothing survives any restart (the disk fixes this);
    #   2. idle-sleep — the free tier stops after ~15 min idle, so restarts
    #      happen constantly (moving off `free` fixes this).
    # A disk alone would not stop the sleeping, and not sleeping alone would not
    # survive a deploy. You need both, which is why they are one change here.
    #
    # BEFORE the first boot with a disk, read docs/operator-runbook.md §2. The
    # first boot finds a catalog file with no companion ownership store and
    # FAILS CLOSED by design; the one-boot CATALOG_OWNERSHIP_BOOTSTRAP procedure
    # is how you migrate, and it has a removal step that must not be skipped.
    #
    # disk:
    #   name: vellar-facilitator-data
    #   mountPath: /var/data      # must match the dirname of CATALOG_FILE below
    #   sizeGB: 1                 # the catalog is small; 1 GB is ample
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STELLAR_NETWORK
        value: "testnet"
      - key: STELLAR_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      # Raised fee ceiling: policy-governed smart-account payments cost ~130k
      # stroops; the @x402/stellar default (50k) rejects them. 500k is ~3.9x the
      # worst REAL settlement measured from this sponsor's own history (127,808)
      # and bounds worst-case drain per settle at 0.05 XLM. Raise if a heavier
      # policy legitimately needs it — rejection is loud, not silent.
      - key: MAX_TX_FEE_STROOPS
        value: "500000"
      # Bazaar catalog persistence (single-instance file store).
      #
      # NOTE: `plan: free` has NO persistent disk, so /var/data does NOT survive
      # a restart or redeploy. This path therefore implies a durability that
      # does not currently exist: the catalog is effectively in-memory and
      # re-populates from the next settled payment. That is the documented
      # free-tier behaviour, not a fault.
      #
      # BEFORE ATTACHING A DISK, read this. Once the files DO persist, the first
      # boot after upgrading finds a catalog file with no companion
      # `<CATALOG_FILE>.ownership` store — indistinguishable from an attacker
      # deleting it — so the catalog FAILS CLOSED: it comes up healthy, serves
      # settlements, and returns an EMPTY discovery catalog, signalled only by
      # `catalogFrozen: "ownership-unreadable"` on /health.
      #
      # To migrate an existing catalog once, set CATALOG_OWNERSHIP_BOOTSTRAP=1 in
      # the Render dashboard for a single boot, then REMOVE it. It is
      # deliberately not declared here: it derives ownership from a file an
      # attacker could have written, and it disables the fail-closed protection
      # while set. It warns loudly on every boot.
      #
      # STEP-BY-STEP for that migration, and for the two other problems a disk
      # introduces (a merchant who cannot rotate their payment address; the
      # tombstone cap), see docs/operator-runbook.md. Read procedure 1 BEFORE
      # onboarding any merchant on a disk-backed deployment: a bound resource URL
      # cannot rotate its payTo in band, and the manual procedure is the only
      # path. That is deliberate — the runbook explains why automating it would
      # give away the property F11 exists for.
      - key: CATALOG_FILE
        value: "/var/data/bazaar-catalog.json"
      # Deliberately NOT set: VERIFICATION_API_URL. Unset, every trust verdict
      # degrades to "unknown", which is the honest default. Configuring it makes
      # that API a trust root, and its response still carries no per-record
      # timestamp (so "newest" falls back to array order) and is unauthenticated.
      # See docs/security-audit.md (F4) for the precondition before enabling.
      - key: SPONSOR_SECRET_KEY
        sync: false
